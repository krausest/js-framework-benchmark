<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Places JS</title>
  <link href="/css/currentStyle.css" rel="stylesheet"/>
  <style>
    * [data-template] {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="container">
      <div class="jumbotron">
        <event-handler-component> 
            <div class="row">
                <div class="col-md-6">
                    <h1>Places.js keyed</h1>
                </div>
                <div class="col-md-6">
                    <div class="row">
                        <div class="col-sm-6 smallpad">
                        <button onClick={run} type="button" class="btn btn-primary btn-block" >Create 1,000 rows</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type="button" class="btn btn-primary btn-block" onClick={runlots}>Create 10,000 rows</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type="button" class="btn btn-primary btn-block" onClick={add}>Append 1,000 rows</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type="button" class="btn btn-primary btn-block" onClick={update}>Update every 10th row</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type="button" class="btn btn-primary btn-block" onClick={clear}>Clear</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type="button" class="btn btn-primary btn-block" onClick={swaprows}>Swap Rows</button>
                        </div>
                    </div>
                </div>
            </div>
          </event-handler-compnent>
      </div>

      <main-element>
        <table class="table table-hover table-striped test-data">
          <tbody
              data-template=data
          >
            <tr class={selected}>
              <td 
                class="col-md-1" 
                textContent={id}>
              </td>
              <td class="col-md-4">
                <a 
                  onClick={select} 
                  textContent={label}
                >
                </a>
              </td>
              <td class="col-md-1">
                <a>
                  <span
                     aria-hidden="true"
                    class="glyphicon glyphicon-remove" 
                    onClick={delete}
                  />
                </a>
              </td>
             <td class="col-md-6"/>
            </tr>
          </tbody>
        </table>
      </main-element>
      <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
   </div>
  <script type="module" async src="src/main.js"></script>
  <script type="module" async src="src/eventHandlerComponent.js"></script>
  </body>
</html>
