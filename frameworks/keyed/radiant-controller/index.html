<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>radiant-controller</title>
		<link href="/css/currentStyle.css" rel="stylesheet" />
	</head>
	<body>
		<div id="main">
			<div data-controller="benchmark">
				<div class="container">
					<div class="jumbotron">
						<div class="row">
							<div class="col-md-6"><h1>Radiant controller</h1></div>
							<div class="col-md-6">
								<div class="row">
									<div class="col-sm-6 smallpad"><button data-ref="run" id="run" type="button" class="btn btn-primary btn-block">Create 1,000 rows</button></div>
									<div class="col-sm-6 smallpad"><button data-ref="runlots" id="runlots" type="button" class="btn btn-primary btn-block">Create 10,000 rows</button></div>
									<div class="col-sm-6 smallpad"><button data-ref="add" id="add" type="button" class="btn btn-primary btn-block">Append 1,000 rows</button></div>
									<div class="col-sm-6 smallpad"><button data-ref="update" id="update" type="button" class="btn btn-primary btn-block">Update every 10th row</button></div>
									<div class="col-sm-6 smallpad"><button data-ref="clear" id="clear" type="button" class="btn btn-primary btn-block">Clear</button></div>
									<div class="col-sm-6 smallpad"><button data-ref="swaprows" id="swaprows" type="button" class="btn btn-primary btn-block">Swap Rows</button></div>
								</div>
							</div>
						</div>
					</div>
					<table class="table table-hover table-striped test-data"><tbody data-ref="rows"></tbody></table>
					<span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
				</div>
			</div>
		</div>
		<script type="module" src="dist/main.js"></script>
	</body>
</html>
