<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>WildflowerJS-pool-"keyed"</title>
    <link href="/css/currentStyle.css" rel="stylesheet"/>
</head>
<body>
<div id='main'>
    <div class="container" data-component="benchmark-pool-app">
        <div class="jumbotron">
            <div class="row">
                <div class="col-md-6">
                    <h1>WildflowerJS-pool-"keyed"</h1>
                </div>
                <div class="col-md-6">
                    <div class="row">
                        <div class="col-sm-6 smallpad">
                            <button type='button' class='btn btn-primary btn-block' id='run' data-action='run'>Create 1,000 rows</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type='button' class='btn btn-primary btn-block' id='runlots' data-action='runLots'>Create 10,000 rows</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type='button' class='btn btn-primary btn-block' id='add' data-action='add'>Append 1,000 rows</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type='button' class='btn btn-primary btn-block' id='update' data-action='update'>Update every 10th row</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type='button' class='btn btn-primary btn-block' id='clear' data-action='clear'>Clear</button>
                        </div>
                        <div class="col-sm-6 smallpad">
                            <button type='button' class='btn btn-primary btn-block' id='swaprows' data-action='swapRows'>Swap Rows</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <table class="table table-hover table-striped test-data">
            <tbody id="tbody" data-pool="rows" data-key="id" data-pool-static>
                <template>
                    <tr data-bind-class="id === props.selectedId ? 'danger' : ''">
                        <td class="col-md-1" data-bind="id"></td>
                        <td class="col-md-4"><a data-action="select" data-bind="label"></a></td>
                        <td class="col-md-1"><a data-action="remove"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a></td>
                        <td class="col-md-6"></td>
                    </tr>
                </template>
            </tbody>
        </table>
        <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
    </div>
</div>
<script src='src/wildflower.lite.min.js' data-csp-safe></script>
<script src='src/Main.js'></script>
</body>
</html>
